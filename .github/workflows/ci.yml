name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Manifest is valid
        run: python3 -c "import json; m = json.load(open('manifest.json')); assert m['id'] and m['version'] and m['entryPoints']"
      - name: Model tests
        run: node tests/model.test.js
      - name: Rooms tests
        run: node tests/rooms.test.js
      - name: Update tests
        run: |
          node tests/update.test.js
          python3 -B -m unittest discover tests
      - name: Backend compiles
        run: |
          python3 -B -c "import ast; ast.parse(open('bin/rog-deck').read())"
          python3 -B -c "import ast; ast.parse(open('bin/rog-deck-power').read())"
      - name: README badge matches the manifest
        run: |
          python3 - <<'PY'
          import json, re
          version = json.load(open("manifest.json"))["version"]
          badge = re.search(r"badge/v([0-9][^-]*)-", open("README.md").read())
          assert badge, "README has no version badge"
          assert badge.group(1) == version, "README badge says %s, manifest.json %s" % (badge.group(1), version)
          PY
